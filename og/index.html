<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { background: var(--bg); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .og::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 72% 46%, color-mix(in oklab, var(--accent) 9%, transparent), transparent 70%); }
  .og-copy { position: absolute; left: 64px; top: 60px; bottom: 56px; width: 470px; display: flex; flex-direction: column; z-index: 2; }
  .og-eyebrow { display: flex; align-items: center; gap: 10px; white-space: nowrap; font: 500 13.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
  .og-title { margin-top: 28px; font-size: 66px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 500; color: var(--ink); text-wrap: balance; }
  .og .fx-capsule { filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 12px color-mix(in oklab, var(--accent) 60%, transparent)); }
  .og-stats { margin-top: auto; display: grid; grid-template-columns: repeat(3, auto); gap: 28px; border-top: 1px solid var(--line); padding-top: 22px; }
  .og-stats dt { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .og-stats dd { margin: 8px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -0.04em; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .og-stats .was { color: var(--ink-3); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--accent) 70%, transparent); text-decoration-thickness: 2px; }
  .og-fig { position: absolute; right: -70px; top: -18px; width: 760px; z-index: 1; }
  .og-fig .iso-svg { width: 100%; }
  .og-fig .fig-readout { right: 104px; bottom: 34px; font-size: 12.5px; }
</style>
